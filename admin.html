<!-- admin.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Kamoulox - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        .container { background: #fff; padding: 20px; border-radius: 8px; max-width: 800px; margin: auto; }
        textarea { width: 100%; height: 300px; }
        button { background: #d32f2f; color: white; padding: 10px 20px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Administration des Banques (JSON)</h1>
        <p>Chargez <code>kamoulox-banques.json</code> (bouton ci-dessous) ou collez son contenu directement.</p>
        <input type="file" id="file-input" accept="application/json"><br><br>
        <textarea id="json-input"></textarea><br><br>
        <button id="btn-upload">Mettre à jour Firebase</button>
        <button id="btn-reset" style="background:#555;">Réinitialiser la partie (gamestate)</button>
        <p id="status"></p>
    </div>

    <script type="module">
        import { db, ref, set } from './firebase-config.js';

        document.getElementById('btn-reset').addEventListener('click', () => {
            if (!confirm("Effacer l'état de la partie en cours (gamestate) ? Les banques (gamedata) ne sont pas touchées.")) return;
            set(ref(db, 'gamestate'), null).then(() => {
                document.getElementById('status').innerText = "Partie réinitialisée.";
            });
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => { document.getElementById('json-input').value = reader.result; };
            reader.readAsText(file, 'utf-8');
        });

        document.getElementById('btn-upload').addEventListener('click', () => {
            try {
                const data = JSON.parse(document.getElementById('json-input').value);
                set(ref(db, 'gamedata'), data).then(() => {
                    document.getElementById('status').innerText = "Banque de données mise à jour avec succès !";
                });
            } catch (e) {
                document.getElementById('status').innerText = "Erreur de format JSON.";
            }
        });
    </script>
</body>
</html>
