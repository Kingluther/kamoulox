<!-- ecran-central.html -->
<!-- Écran de PROJECTION uniquement : aucune interaction, aucun bouton.
     Les contrôles sont dans animateur.html (autre fichier, autre appareil). -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Kamoulox - Écran Central</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace; color: #fff5e6; margin: 0; padding: 24px;
            background: radial-gradient(ellipse at center, #4a2b0a 0%, #1a0e02 75%);
            min-height: 100vh; box-sizing: border-box;
        }
        h1#logo {
            text-align: center; font-size: 56px; font-weight: 900; letter-spacing: 4px; margin: 0 0 6px 0;
            background: linear-gradient(180deg, #ffd54f 0%, #ff8f00 45%, #e65100 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: 0 4px 12px rgba(0,0,0,0.6);
        }
        #phase-banner { text-align: center; color: #ffcc80; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; font-size: 15px; }

        #board-container { display: none; width: 100%; max-width: 640px; margin: 0 auto 16px; aspect-ratio: 1012/616;
            background: url('kamoulox-plateau-visuel.png') center/cover; position: relative; border: 4px solid #ff8f00;
            border-radius: 10px; box-shadow: 0 0 30px rgba(255,143,0,0.5); transition: all 0.5s ease; }
        #board-container.mini { max-width: 220px; position: absolute; top: 90px; right: 24px; z-index: 5; }
        #pion { width: 30px; height: 30px; background: #ff6f00; border: 2px solid #fff; border-radius: 50%;
                position: absolute; transition: all 0.8s ease-in-out; box-shadow: 0 0 10px #ff6f00; }
        #carte-mystere-overlay { display: none; position: absolute; top: 50%; left: 50%; width: 42%; aspect-ratio: 5/7;
                background: url('carte.jpg') center/cover; border: 5px solid #fff; border-radius: 14px; z-index: 10;
                box-shadow: 0 10px 40px rgba(0,0,0,0.7); transform: translate(-50%,-50%); }
        #carte-mystere-overlay.show { display: block; animation: carteSpinCentral 0.7s ease-out forwards; }
        @keyframes carteSpinCentral {
            from { transform: translate(-50%,-50%) rotateY(180deg) scale(0.4); opacity: 0; }
            to { transform: translate(-50%,-50%) rotateY(0) scale(1); opacity: 1; }
        }

        .history { font-size: 24px; line-height: 1.6; max-width: 900px; margin: 0 auto; height: 60vh; overflow-y: auto;
                   background: rgba(0,0,0,0.25); border-radius: 10px; padding: 16px; }
        .replique-j1 { color: #81c784; }
        .replique-j2 { color: #64b5f6; }
        .replique-anim { color: #ffd54f; }
        .replique-system { color: #ff5252; font-weight: bold; }

        .alert-rouge { animation: borderBlink 0.5s 3; }
        @keyframes borderBlink { 50% { box-shadow: 0 0 0 8px red inset; } }

        #kamoulox-central-banner { display: none; font-size: 90px; font-weight: 900; text-align: center; margin-top: 30px;
            color: #ff3d00; text-shadow: 0 0 30px #ff3d00, 0 0 60px #ffab00; letter-spacing: 4px; }
    </style>
</head>
<body id="central-screen">
    <h1 id="logo">KAMOULOX</h1>
    <div id="phase-banner"></div>
    <div id="board-container">
        <div id="pion"></div>
        <div id="carte-mystere-overlay"></div>
    </div>
    <div id="dialogue-history" class="history"></div>
    <div id="kamoulox-central-banner">KAMOULOX !</div>

    <script type="module" src="ecran-central.js"></script>
</body>
</html>
