<!-- join.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamoulox - Rejoindre la partie</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; text-align: center; padding: 20px; }
        #qrcode { background: #fff; display: inline-block; padding: 12px; border-radius: 8px; margin: 16px 0; }
        button { display: block; width: 90%; max-width: 320px; margin: 10px auto; padding: 18px; font-size: 18px;
                 background: #333; color: #fff; border: 1px solid #555; border-radius: 8px; cursor: pointer; }
        button:disabled { background: #111; color: #555; cursor: not-allowed; }
        button.free { background: #2e7d32; }
    </style>
</head>
<body>
    <h1>KAMOULOX</h1>
    <p>Scannez ce QR code depuis les autres appareils pour rejoindre :</p>
    <div id="qrcode"></div>
    <p>Choisissez votre rôle :</p>
    <button id="role-J1">Joueur 1</button>
    <button id="role-J2">Joueur 2</button>
    <button id="role-anim">Animateur</button>
    <p id="status" style="color:#f88;"></p>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="join.js"></script>
</body>
</html>
